name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: "1.19.4", yarn: "1.19.4+build.2",  java: "17", mixin: "JAVA_17", dep: ">=1.19.4 <1.20"}
          - {mc: "1.20.1", yarn: "1.20.1+build.10", java: "17", mixin: "JAVA_17", dep: ">=1.20 <=1.20.1"}
          - {mc: "1.20.2", yarn: "1.20.2+build.4",  java: "17", mixin: "JAVA_17", dep: "1.20.2"}
          - {mc: "1.20.4", yarn: "1.20.4+build.3",  java: "17", mixin: "JAVA_17", dep: ">=1.20.3 <=1.20.4"}
          - {mc: "1.20.6", yarn: "1.20.6+build.3",  java: "21", mixin: "JAVA_21", dep: ">=1.20.5 <=1.20.6"}
          - {mc: "1.21",   yarn: "1.21+build.9",    java: "21", mixin: "JAVA_21", dep: ">=1.21 <=1.21.1"}
          - {mc: "1.21.3", yarn: "1.21.3+build.2",  java: "21", mixin: "JAVA_21", dep: ">=1.21.2 <=1.21.3"}
          - {mc: "1.21.4", yarn: "1.21.4+build.8",  java: "21", mixin: "JAVA_21", dep: "1.21.4"}
    env:
      MC: ${{ matrix.mc }}
      YARN: ${{ matrix.yarn }}
      JAVA: ${{ matrix.java }}
      MIXIN: ${{ matrix.mixin }}
      DEP: ${{ matrix.dep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - run: unzip -q ./*.zip
      - run: cd fastplace && gradle build -Pminecraft_version="$MC" -Pyarn_mappings="$YARN" -Pjava_version="$JAVA" -Pmixin_level="$MIXIN" -Pmc_dep="$DEP"
      - uses: actions/upload-artifact@v4
        with:
          name: ObsidianCrystalOptimizer-mc${{ matrix.mc }}
          path: |
            fastplace/build/libs/fastplace-*.jar
            !fastplace/build/libs/*-sources.jar
